# Loon [General] DNS bootstrap/fallback fragment
#
# Add this line to the [General] section of your private Loon profile. Keep
# the full profile private because it may contain node credentials and a MITM
# certificate. Normal lookups still use the configured DoH servers; these
# addresses are only used to bootstrap/fallback when a DoH endpoint cannot be
# resolved.
dns-server=223.5.5.5,223.6.6.6
